<mat-card class="dashboard-header">
  <div class="header-content">

    <!-- TÍTULO -->
    <div class="title-container">
      <h1>Gestión de Tareas OnOff</h1>
      <span class="subtitle">Administra y organiza tus tareas</span>
    </div>

    <!-- ACCIONES + FILTRO -->
    <div class="right-panel">
      <div class="actions">
        <button
          mat-stroked-button
          color="primary"
          (click)="consultar()">
          Consultar
        </button>

        <button
          mat-raised-button
          class="btn-create"
          (click)="crear()">
          Crear
        </button>

        <!-- LOGOUT -->
        <button
          mat-icon-button
          class="btn-logout"
          matTooltip="Cerrar sesión"
          (click)="logout()">
          <mat-icon>logout</mat-icon>
        </button>
      </div>

      <!-- FILTRO -->
      <div class="filter" *ngIf="mostrarFiltro">
        <mat-form-field appearance="outline">
          <mat-label>Estado</mat-label>
          <mat-select
            [(value)]="filtroEstado"
            (selectionChange)="aplicarFiltro()">
            <mat-option value="todas">Todas</mat-option>
            <mat-option value="pendiente">Pendientes</mat-option>
            <mat-option value="completada">Completadas</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>

  </div>
</mat-card>

<!-- FORMULARIO -->
<mat-card *ngIf="mostrarFormulario">
  <h3>{{ editando ? 'Editar tarea' : 'Nueva tarea' }}</h3>

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <mat-form-field class="full-width">
      <mat-label>Título</mat-label>
      <input matInput formControlName="titulo" />
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit">
      Guardar
    </button>
  </form>
</mat-card>

<mat-card>
  <table mat-table [dataSource]="dataSource">

    <!-- TITULO -->
    <ng-container matColumnDef="titulo">
      <th mat-header-cell *matHeaderCellDef>Título</th>
      <td mat-cell *matCellDef="let task">{{ task.title }}</td>
    </ng-container>

    <!-- ESTADO -->
    <ng-container matColumnDef="estado">
      <th mat-header-cell *matHeaderCellDef>Estado</th>
      <td mat-cell *matCellDef="let task">
        <mat-select
          class="estado-select"
          [value]="task.isCompleted ? 'completada' : 'pendiente'"
          (selectionChange)="cambiarEstado(task, $event.value)">
          <mat-option value="pendiente">Pendiente</mat-option>
          <mat-option value="completada">Completada</mat-option>
        </mat-select>
      </td>
    </ng-container>

    <!-- ACCIONES -->
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let task">
        <button mat-icon-button color="primary" (click)="editar(task)">
          <mat-icon>edit</mat-icon>
        </button>

        <button mat-icon-button color="warn" (click)="eliminar(task.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</mat-card>
